[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbox"
version = "0.1.0"
description = "A plain desktop app for local image generation, over ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manraj Singh" }]
keywords = ["image-generation", "stable-diffusion", "comfyui", "sdxl", "desktop"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["pywebview>=5.0"]

[project.scripts]
promptbox = "promptbox.app:main"

[project.urls]
Homepage = "https://github.com/Manraj10/promptbox"
Issues = "https://github.com/Manraj10/promptbox/issues"

[tool.setuptools.packages.find]
include = ["promptbox*"]

[tool.setuptools.package-data]
promptbox = ["ui/*.html"]
